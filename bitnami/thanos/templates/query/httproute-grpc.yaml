{{- if and .Values.query.enabled .Values.query.httproute.grpc.enabled -}}
{{- if or (not .Values.query.httproute.grpc.parentRefs) (lt (len .Values.query.httproute.grpc.parentRefs) 1) }}
{{- fail "query.httproute.grpc.parentRefs must be defined and contain at least one Gateway reference" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "thanos.query.fullname" . }}-grpc
  namespace: {{ include "common.names.namespace" . }}
  {{- $labels := include "common.tplvalues.merge" ( dict "values" ( list .Values.query.httproute.grpc.labels .Values.commonLabels ) "context" . ) }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" $labels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: query
  {{- if or .Values.query.httproute.grpc.annotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" ( dict "values" ( list .Values.query.httproute.grpc.annotations .Values.commonAnnotations ) "context" . ) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range $idx, $parentRef := .Values.query.httproute.grpc.parentRefs }}
    - group: {{ default "gateway.networking.k8s.io" $parentRef.group }}
      kind: {{ default "Gateway" $parentRef.kind }}
      name: {{ include "common.tplvalues.render" ( dict "value" (required (printf "query.httproute.grpc.parentRefs[%d].name is required" $idx) $parentRef.name) "context" $ ) }}
      {{- if $parentRef.namespace }}
      namespace: {{ include "common.tplvalues.render" ( dict "value" $parentRef.namespace "context" $ ) }}
      {{- end }}
      {{- if $parentRef.sectionName }}
      sectionName: {{ include "common.tplvalues.render" ( dict "value" $parentRef.sectionName "context" $ ) }}
      {{- end }}
      {{- if $parentRef.port }}
      port: {{ $parentRef.port }}
      {{- end }}
    {{- end }}
  {{- if .Values.query.httproute.grpc.hostnames }}
  hostnames: {{- include "common.tplvalues.render" ( dict "value" .Values.query.httproute.grpc.hostnames "context" $ ) | nindent 4 }}
  {{- else if or .Values.query.ingress.grpc.hostname .Values.query.ingress.grpc.extraHosts }}
  hostnames:
    {{- if .Values.query.ingress.grpc.hostname }}
    - {{ include "common.tplvalues.render" ( dict "value" .Values.query.ingress.grpc.hostname "context" $ ) | quote }}
    {{- end }}
    {{- range .Values.query.ingress.grpc.extraHosts }}
    - {{ include "common.tplvalues.render" ( dict "value" .name "context" $ ) | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- if .Values.query.httproute.grpc.rules }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.query.httproute.grpc.rules "context" $ ) | nindent 4 }}
    {{- else }}
    - matches:
        {{- if .Values.query.httproute.grpc.matches }}
        {{- include "common.tplvalues.render" ( dict "value" .Values.query.httproute.grpc.matches "context" $ ) | nindent 8 }}
        {{- else }}
        - path:
            {{- $pathType := default .Values.query.ingress.grpc.pathType .Values.query.httproute.grpc.pathType }}
            {{- if eq $pathType "Exact" }}
            type: Exact
            {{- else if eq $pathType "RegularExpression" }}
            type: RegularExpression
            {{- else }}
            type: PathPrefix
            {{- end }}
            value: {{ default .Values.query.ingress.grpc.path .Values.query.httproute.grpc.path | quote }}
        {{- end }}
      {{- if .Values.query.httproute.grpc.filters }}
      filters: {{- include "common.tplvalues.render" ( dict "value" .Values.query.httproute.grpc.filters "context" $ ) | nindent 8 }}
      {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "thanos.query.fullname" . }}-grpc
          port: {{ .Values.query.serviceGrpc.ports.grpc }}
          weight: 1
      {{- if .Values.query.httproute.grpc.timeouts }}
      timeouts: {{- include "common.tplvalues.render" ( dict "value" .Values.query.httproute.grpc.timeouts "context" $ ) | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
